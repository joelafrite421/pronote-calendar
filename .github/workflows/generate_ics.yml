name: Update Pronote WebCAL

on:
  schedule:
    # Exécution du lundi au vendredi à 5h00 UTC (7h00 heure française)
    - cron: '0 5 * * 1-5'
  workflow_dispatch: # Lancement manuel possible

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Autorise l'écriture du commit dans le dépôt
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          PRONOTE_URL: ${{ secrets.PRONOTE_URL }}
          PRONOTE_USERNAME: ${{ secrets.PRONOTE_USERNAME }}
          PRONOTE_PASSWORD: ${{ secrets.PRONOTE_PASSWORD }}
        run: python script.py

      - name: Commit and push updated .ics file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add luce.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of luce.ics" && git push)
